# Deploy workflow.
# Triggered automatically on version tags (v*), or manually via workflow_dispatch.
# Detects whether frontend changed since last deploy, and only deploys when needed.
# Tag pushes always deploy. Use force_frontend to override change detection on manual runs.
# See github-secrets.md (not committed) for required secrets.

name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_frontend:
        description: Force frontend deploy (ignore change detection)
        type: boolean
        default: false

env:
  AWS_REGION: eu-west-1
  SSM_PREFIX: /blindsweeper/prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Change detection ────────────────────────────────────────────────────

      - name: Get last deployed SHA
        id: last_deploy
        run: |
          FRONTEND_SHA=$(aws ssm get-parameter \
            --name "$SSM_PREFIX/LAST_DEPLOYED_FRONTEND_SHA" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          echo "frontend_sha=$FRONTEND_SHA" >> "$GITHUB_OUTPUT"
          echo "Last frontend: ${FRONTEND_SHA:-none}"

      - name: Detect changes
        id: changes
        run: |
          CURRENT="$GITHUB_SHA"
          FRONTEND_SHA="${{ steps.last_deploy.outputs.frontend_sha }}"

          DEPLOY_FRONTEND=false

          if [[ "${{ inputs.force_frontend }}" == "true" ]] || [[ -z "$FRONTEND_SHA" ]]; then
            DEPLOY_FRONTEND=true
          elif git diff --name-only "$FRONTEND_SHA" "$CURRENT" | grep -qE "^frontend/|^package\.json"; then
            DEPLOY_FRONTEND=true
          fi

          GIT_VERSION=$(git describe --tags --always)
          {
            echo "deploy_frontend=$DEPLOY_FRONTEND"
            echo "git_version=$GIT_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy - frontend: $DEPLOY_FRONTEND, version: $GIT_VERSION"

      # ── Frontend ────────────────────────────────────────────────────────────

      - name: Build frontend
        if: steps.changes.outputs.deploy_frontend == 'true'
        env:
          VITE_BASE_PATH: /
        run: |
          GIT_VER="${{ steps.changes.outputs.git_version }}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "{\"version\":\"$GIT_VER\",\"buildTime\":\"$BUILD_TIME\"}" > frontend/public/version.json
          npm ci --prefix frontend && npm run build --prefix frontend

      - name: Sync frontend to S3
        if: steps.changes.outputs.deploy_frontend == 'true'
        run: |
          aws s3 sync frontend/dist/assets/ s3://${{ secrets.FRONTEND_BUCKET_NAME }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete
          aws s3 sync frontend/dist/ s3://${{ secrets.FRONTEND_BUCKET_NAME }}/ \
            --exclude 'assets/*' \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      - name: Invalidate CloudFront
        if: steps.changes.outputs.deploy_frontend == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CF_DIST_ID }}" \
            --paths "/*"

      # ── Update deployed SHA ─────────────────────────────────────────────────
      # Update before smoke test so change detection is correct on next run
      # even if smoke test has transient DNS/propagation issues.

      - name: Update deployed SHA in SSM
        if: steps.changes.outputs.deploy_frontend == 'true'
        run: |
          aws ssm put-parameter \
            --name "$SSM_PREFIX/LAST_DEPLOYED_FRONTEND_SHA" \
            --value "$GITHUB_SHA" \
            --type String \
            --overwrite
          echo "Updated frontend SHA: $GITHUB_SHA"

      # ── Smoke test ──────────────────────────────────────────────────────────

      - name: Smoke test
        if: steps.changes.outputs.deploy_frontend == 'true'
        env:
          FRONTEND_DOMAIN: ${{ secrets.FRONTEND_DOMAIN }}
          EXPECTED_VERSION: ${{ steps.changes.outputs.git_version }}
        run: |
          check() {
            local label="$1" url="$2" expected="${3:-200}"
            local status attempts=15 delay=12
            for ((i=1; i<=attempts; i++)); do
              status=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "$url") || status="000"
              if [[ "$status" == "$expected" ]]; then
                echo "PASS $label - HTTP $status"
                return 0
              fi
              echo "  attempt $i/$attempts: got $status, waiting ${delay}s..."
              sleep $delay
            done
            echo "FAIL $label - expected $expected, got $status"
            exit 1
          }
          check_version() {
            local label="$1" url="$2"
            local actual attempts=15 delay=12
            for ((i=1; i<=attempts; i++)); do
              actual=$(curl -s --max-time 15 "$url" | jq -r '.version') || actual="null"
              if [[ "$actual" == "$EXPECTED_VERSION" ]]; then
                echo "PASS $label version - $actual"
                return 0
              fi
              echo "  attempt $i/$attempts: got $actual, waiting ${delay}s..."
              sleep $delay
            done
            echo "FAIL $label version - expected $EXPECTED_VERSION, got $actual"
            exit 1
          }
          check "Frontend root" "https://$FRONTEND_DOMAIN/"
          check_version "frontend" "https://$FRONTEND_DOMAIN/version.json"
